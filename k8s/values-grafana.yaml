adminUser: admin
adminPassword: password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
    - name: mimir
      type: prometheus
      access: proxy
      url: http://mimir-service:8080/prometheus
      isDefault: true

testFramework:
  enabled: false

persistence:
  enabled: false
