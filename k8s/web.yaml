apiVersion: apps/v1
kind: Deployment
metadata:
  name: myproject
  labels:
    app: myproject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myproject
  template:
    metadata:
      labels:
        app: myproject
    spec:
      volumes:
      - name: tmp-database
        emptyDir: {}
      containers:
      - name: myproject
        image: celery-app:latest
        imagePullPolicy: Never
        command: ["python3", "main.py"]
        volumeMounts:
        - mountPath: /data
          name: tmp-database
        env:
        - name: DATABASE_DIR
          value: /data
        - name: CELERY_BROKER_URL
          value: "amqp://guest:guest@rabbitmq-service:5672"
        - name: CELERY_RESULT_BACKEND
          value: "rpc://"
      - name: consumer-small
        image: celery-app:latest
        imagePullPolicy: Never
        command: ["celery", "-A", "main.celery_app", "worker"]
        args:
          - "--queues"
          - "small_tasks"
          - "--loglevel"
          - "INFO"
        volumeMounts:
        - mountPath: /data
          name: tmp-database
        env:
        - name: DATABASE_DIR
          value: /data
        - name: CELERY_BROKER_URL
          value: "amqp://guest:guest@rabbitmq-service:5672"
        - name: CELERY_RESULT_BACKEND
          value: "rpc://"
